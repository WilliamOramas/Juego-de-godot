<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" stroke="#3e4e5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer CRT Head Monitor -->
  <rect x="24" y="16" width="80" height="72" rx="8" ry="8" fill="#a3b8cc" />
  
  <!-- Screen Area -->
  <rect x="32" y="24" width="64" height="52" rx="5" ry="5" fill="#0c1a30" stroke="#1e2f44" stroke-width="2" />
  
  <!-- Camera/Sensor Mount on top -->
  <rect x="48" y="10" width="32" height="6" rx="2" fill="#5c6e80" />
  <circle cx="64" cy="13" r="2.5" fill="#3ae2e2" stroke="none" />
  
  <!-- Medication Dispenser Hatch underneath screen -->
  <rect x="48" y="82" width="32" height="6" rx="1.5" fill="#5c6e80" />
  
  <!-- Central Column/Neck -->
  <rect x="60" y="88" width="8" height="18" fill="#7d90a6" />
  
  <!-- Base Chassis Plate -->
  <rect x="40" y="106" width="48" height="6" rx="2" fill="#a3b8cc" />
  
  <!-- Omni-directional Caster Wheels -->
  <circle cx="48" cy="117" r="5" fill="#2b3540" />
  <circle cx="48" cy="117" r="2" fill="#7d90a6" stroke="none" />
  <circle cx="80" cy="117" r="5" fill="#2b3540" />
  <circle cx="80" cy="117" r="2" fill="#7d90a6" stroke="none" />
</svg>
