<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
	<!-- Head down -->
	<rect x="10" y="20" width="6" height="6" fill="#fcdfb6" />
	<rect x="10" y="23" width="6" height="3" fill="#5c3a21" />
	<!-- Body -->
	<rect x="14" y="12" width="10" height="8" fill="#40e0d0" />
	<!-- Arms flailing -->
	<rect x="14" y="8" width="2" height="4" fill="#fcdfb6" />
	<rect x="22" y="20" width="2" height="4" fill="#fcdfb6" />
	<!-- Legs up -->
	<rect x="24" y="8" width="6" height="4" fill="#8b5a2b" />
	<rect x="26" y="2" width="4" height="6" fill="#8b5a2b" />
	<rect x="26" y="0" width="4" height="2" fill="#111111" />
	<rect x="30" y="8" width="2" height="4" fill="#111111" />
</svg>
